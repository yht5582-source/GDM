name: Test GDM
# Pages is served directly from main (legacy branch deploy); this workflow only validates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clinical rule tests (includes index.html ↔ clinical.mjs sync check)
        run: node --test tests/clinical.test.mjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile interaction checks
        run: node tests/browser.mjs
